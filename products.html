<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cafeteria alexito - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Products - cafeteria alexito</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="checkout.html">Checkout</a></li>
            </ul>
        </nav>
    </header>

    <section class="product-list container">
        <div class="product-item">
            <h2>Ethiopian Yirgacheffe</h2>
            <img src="images/yirgacheffe.jpg" alt="Ethiopian Yirgacheffe">
            <p>Bright and citrusy with floral notes.</p>
            <p class="price">$15.99</p>
            <button class="add-to-cart-btn" data-id="1" data-name="Ethiopian Yirgacheffe" data-price="15.99">Add to Cart</button>
        </div>

        <div class="product-item">
            <h2>Colombian Supremo</h2>
            <img src="images/supremo.jpg" alt="Colombian Supremo">
            <p>Smooth and well-balanced with nutty undertones.</p>
            <p class="price">$14.50</p>
            <button class="add-to-cart-btn" data-id="2" data-name="Colombian Supremo" data-price="14.50">Add to Cart</button>
        </div>

        <div class="product-item">
            <h2>Sumatra Mandheling</h2>
            <img src="images/mandheling.jpg" alt="Sumatra Mandheling">
            <p>Earthy and bold with a rich, syrupy body.</p>
            <p class="price">$16.25</p>
            <button class="add-to-cart-btn" data-id="3" data-name="Sumatra Mandheling" data-price="16.25">Add to Cart</button>
        </div>
    </section>
    <script src="script.js" defer></script>
</body>
</html>
